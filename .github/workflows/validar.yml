name: Validar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter analyze
        run: flutter analyze lib/ test/ --no-fatal-infos

      - name: flutter test
        run: flutter test
