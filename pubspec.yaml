name: agrocalc
description: Calculadora offline de regulagem para pulverizadores e plantadeiras.
publish_to: 'none'
version: 1.0.0+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  uuid: ^4.2.1
  intl: ^0.20.2
  google_fonts: ^6.1.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  share_plus: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  macos:
    generate: true
  windows:
    generate: true
